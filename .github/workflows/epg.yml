name: Refresh EPG

on:
  schedule:
    - cron: "15 */12 * * *"  # twice a day
  workflow_dispatch:
  push:
    paths:
      - "playlists/**"
      - "scripts/build_epg.py"

permissions:
  contents: write

concurrency:
  group: epg
  cancel-in-progress: false

jobs:
  epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build EPG
        run: python scripts/build_epg.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- epg/; then
            echo "EPG unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add epg/
          git commit -m "Refresh EPG"
          git push
